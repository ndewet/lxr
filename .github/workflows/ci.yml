name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR, but never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures in CI; keep the tree clean rather than accumulating noise.
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      # --all-targets covers lib/bins/tests/benches/examples but skips doctests,
      # so run those separately.
      - name: Test
        run: cargo test --workspace --all-features --all-targets

      - name: Doc tests
        run: cargo test --workspace --all-features --doc

      # An example is documentation, thus it must keep working. The step above
      # compiles each one. This step compiles them again on their own, so that a
      # change to the test command cannot drop them, and it runs each one, so
      # that a panic fails the build. The loop reads the directory, thus a new
      # example needs no change here.
      - name: Examples
        run: |
          cargo build --workspace --all-features --examples
          for path in lxr/examples/*.rs; do
            name="$(basename "$path" .rs)"
            echo "--- $name"
            cargo run --quiet --package lxr --example "$name" >/dev/null
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Docs
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings
