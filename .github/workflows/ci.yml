name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR, but never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures in CI; keep the tree clean rather than accumulating noise.
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      # --all-targets covers lib/bins/tests/benches/examples but skips doctests,
      # so run those separately.
      - name: Test
        run: cargo test --workspace --all-features --all-targets

      - name: Doc tests
        run: cargo test --workspace --all-features --doc

      # The derive macro sits behind a feature, and the command above turns each
      # feature on. This step compiles the runtime alone, so that a doc test
      # that needs the macro cannot land outside that feature gate. The examples
      # and the integration tests each need the macro, thus this step reads the
      # library and its doc tests alone.
      - name: No default features
        run: |
          cargo test --package lxr --no-default-features --lib
          cargo test --package lxr --no-default-features --doc

      # An example is documentation, thus it must keep working. The step above
      # compiles each one. This step compiles them again on their own, so that a
      # change to the test command cannot drop them, and it runs each one, so
      # that a panic fails the build. Cargo names each example target, thus a
      # new example needs no change here, and one that lives in a directory
      # counts as well.
      - name: Examples
        run: |
          cargo build --workspace --all-features --examples
          names="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lxr") | .targets[]
                     | select(.kind[] == "example") | .name')"
          for name in $names; do
            echo "--- $name"
            cargo run --quiet --package lxr --example "$name" >/dev/null
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Docs
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings
