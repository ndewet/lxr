name: Writing standard

# Claude reads the prose that the pull request adds or changes, and compares it
# against .github/writing-standard.md. The check is advisory: it reports each
# violation as a comment and always succeeds, because a language judgement must
# not block a merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The review reads only the Rust sources. A pull request that changes no
    # other file starts no run, thus it costs nothing. An example is
    # documentation, thus its prose is in scope as well.
    paths:
      - "**/src/**/*.rs"
      - "lxr/examples/**/*.rs"

# One review per pull request. A new push replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  review:
    name: Writing standard
    runs-on: ubuntu-latest
    # A pull request from a fork gets no secrets, thus the action cannot run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # The review reads the diff against the base branch.
          fetch-depth: 0

      # The `paths` filter above starts a run for each change to a Rust source.
      # Most of those changes are code, and the review reads prose only. This
      # step finds the prose, thus the model runs only when it has work.
      #
      # The patterns match more than the scope on purpose. A false match costs
      # one review. A missed match loses one.
      - name: Look for changed prose
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --unified=0 "${BASE_SHA}...HEAD" \
            -- ':(glob)**/src/**/*.rs' ':(glob)lxr/examples/**/*.rs' \
            | grep -vE '^\+\+\+' \
            | grep -qE '^\+.*(//|panic!|unreachable!|todo!|assert|expect\(|format!|write!)'
          then
            echo 'prose=true' >>"$GITHUB_OUTPUT"
          else
            echo 'prose=false' >>"$GITHUB_OUTPUT"
            echo 'The pull request changes no prose. The review does not run.' \
              >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.prose == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Each inline comment carries `confirmed: true`, thus the action needs
          # no second model to classify the comments before it posts them.
          classify_inline_comments: false
          # track_progress stays off. It posts a tracking comment when the run
          # starts, thus a pull request with correct prose got a comment that
          # reported nothing. With it off, the action posts nothing and the
          # prompt decides.
          #
          # The cost is the mode. The action reads this as agent mode, and
          # agent mode runs only when this file matches the copy on the default
          # branch. Thus the check skips a pull request that changes this file,
          # and it reports the skip in the log.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a technical editor. Review the text that this pull request
            adds or changes against the writing standard of this repository.

            ## Procedure

            1. Read `.github/writing-standard.md`. It holds every rule that
               applies. Use no other style rule.
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` to get
               the diff.
            3. Examine the text in scope, one file at a time. Read the file
               when you need the context around a changed line.
            4. Report each violation.

            ## Scope

            Examine only the added lines and the modified lines of the diff, in
            the files that match `**/src/**/*.rs` or `lxr/examples/**/*.rs`.

            In those lines, examine only prose:

            - Doc comments (`///` and `//!`).
            - Non-documentation comments (`//`).
            - The text of a message, for example a `panic!`, an `assert!`, or
              an error `Display`.

            Ignore code identifiers, test names, and unchanged lines. Ignore
            the code itself: correctness, performance, and design are not part
            of this review.

            ## Report

            Write nothing to the pull request until you have examined all the
            text in scope. Then, if you found no violation, stop. Post nothing.

            If you found one violation or more, do these two steps:

            1. For each violation, call
               `mcp__github_inline_comment__create_inline_comment` on the line
               that causes it, with `confirmed: true`. Write each comment as:

               - The rule that the text breaks, in a few words.
               - The text that breaks it, quoted.
               - One rewrite that obeys the rule.

               Keep each comment to a maximum of four sentences.

            2. Post one summary that gives the number of violations, groups
               them by rule, and states that the check is advisory. Run
               `gh pr comment ${{ github.event.pull_request.number }}
               --edit-last --create-if-none --body "..."`. This replaces the
               summary of the previous run. If the command fails, run it again
               without `--edit-last --create-if-none`.

            Obey the writing standard in your own text.

            ## Restraint

            Report only a clear violation of a rule in
            `.github/writing-standard.md`. Report no style preference and no
            opinion. A rewrite that is merely different from the text is not a
            violation.

            Silence is the correct result for a pull request that obeys the
            standard, and for a pull request that changes no file in scope.
            Post no comment to report that you found nothing. Report that in
            your final message instead, which stays in the workflow log.
          # The review matches text against a written checklist. It needs no
          # deep reasoning, thus a smaller model at low effort does the work.
          #
          # The turn cap holds a runaway loop. Each inline comment costs one
          # turn, thus the cap must stay above the number of violations that
          # one pull request can hold.
          claude_args: |
            --model claude-sonnet-5
            --effort low
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read"
