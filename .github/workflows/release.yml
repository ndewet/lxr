name: Release

# Releases are cut by hand, not on every merge. A dispatch aggregates every
# unreleased commit on main - all the ones since the last tag - into one version.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the version and changelog without tagging or publishing"
        type: boolean
        default: false

permissions:
  contents: write

# Never cut two releases at once; queue them instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch can be aimed at any ref; versions are only meaningful
      # when derived from main's history.
      - name: Check ref
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Releases must be dispatched from main (got ${REF})."
          exit 1

      - uses: actions/checkout@v5
        with:
          # Full history and tags: the version is derived from the commits since
          # the last release tag.
          fetch-depth: 0

      - name: Decide next version
        id: plan
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        # Invoked via bash so the scripts work regardless of their git file mode.
        run: bash .github/scripts/next-release.sh

      - name: Install Rust (stable)
        if: steps.plan.outputs.release == 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Don't tag a commit that doesn't build and pass its tests.
      - name: Verify
        if: steps.plan.outputs.release == 'true'
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test --all-features --all-targets
          cargo test --all-features --doc

      - name: Bump crate version
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          bash .github/scripts/set-cargo-version.sh "$VERSION"
          cargo update --workspace   # keep Cargo.lock's own entry in sync

      - name: Commit, tag and push
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            # First release: Cargo.toml already declares this version, so there
            # is nothing to bump - just tag the commit as it stands.
            echo "Cargo.toml already at ${TAG}; tagging without a bump commit."
          else
            # "chore" so this commit never triggers a release of its own; the
            # [skip ci] marker also keeps it from re-running the workflows.
            git commit -m "chore(release): ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"

      - name: Summary
        if: always() && steps.plan.conclusion == 'success'
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          TAG: ${{ steps.plan.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          {
            if [[ "$RELEASE" != "true" ]]; then
              echo 'No `major`/`feat`/`fix` commits since the last release - nothing to cut.'
            elif [[ "$DRY_RUN" == "true" ]]; then
              echo "Dry run: would release **${TAG}**"
              echo
              cat "$NOTES_FILE"
            else
              echo "Released **${TAG}**"
              echo
              cat "$NOTES_FILE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
