name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Never cut two releases at once; queue them instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags: the version is derived from the commits since
          # the last release tag.
          fetch-depth: 0

      - name: Decide next version
        id: plan
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        # Invoked via bash so the scripts work regardless of their git file mode.
        run: bash .github/scripts/next-release.sh

      - name: Install Rust (stable)
        if: steps.plan.outputs.release == 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Don't tag a commit that doesn't build and pass its tests.
      - name: Verify
        if: steps.plan.outputs.release == 'true'
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test --all-features --all-targets
          cargo test --all-features --doc

      - name: Bump crate version
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          bash .github/scripts/set-cargo-version.sh "$VERSION"
          cargo update --workspace   # keep Cargo.lock's own entry in sync

      - name: Commit, tag and push
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            # First release: Cargo.toml already declares this version, so there
            # is nothing to bump - just tag the commit as it stands.
            echo "Cargo.toml already at ${TAG}; tagging without a bump commit."
          else
            # "chore" so this commit never triggers a release of its own; the
            # [skip ci] marker also keeps it from re-running the workflows.
            git commit -m "chore(release): ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"

      - name: Summary
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if [[ "$RELEASE" == "true" ]]; then
            echo "Released **${TAG}**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No `major`/`feat`/`fix` commits since the last release - nothing to cut.' >> "$GITHUB_STEP_SUMMARY"
          fi
