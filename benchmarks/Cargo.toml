[package]
name = "runeweaver-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.86"

[workspace]

[dev-dependencies]
criterion = "0.8.2"
quote = "1"
runeweaver = { path = "../runeweaver" }
runeweaver-codegen = { path = "../runeweaver-codegen" }
syn = "2"

[[bench]]
name = "benchmarks"
path = "benchmarks.rs"
harness = false

[lints.rust]
unsafe_code = "forbid"
