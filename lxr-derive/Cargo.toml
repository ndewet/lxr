[package]
name = "lxr-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The derive macro of lxr. Read the `lxr` crate, and do not hold this one."
readme = "../README.md"
keywords = ["lexer", "lexing", "tokenizer", "regex", "derive"]
categories = ["parsing", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

# The macro builds the automaton at compile time, thus it holds the codegen
# crate. CONTRIBUTING.md holds the rule on the dependencies.
[dependencies]
lxr-codegen.workspace = true
proc-macro2 = "1.0"
quote = "1.0"
syn = "3.0"

[lints]
workspace = true
