[workspace]
members = ["lxr", "lxr-codegen", "lxr-derive"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
# Edition 2024 needs this version of the compiler. The CI job `MSRV` builds
# each crate with it, thus a later feature cannot land without a bump here.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ndewet/lxr"

[workspace.dependencies]
lxr-codegen = { version = "0.2.0", path = "lxr-codegen" }
lxr-derive = { version = "0.2.0", path = "lxr-derive" }

# The lints mechanise the error handling standard in CONTRIBUTING.md.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

# `clippy::panic_in_result_fn` stays off. A function that gives a `Result` for
# a fault in the input still panics for a defect in lxr. The lint rejects that
# pattern, thus it disagrees with the standard.
[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
